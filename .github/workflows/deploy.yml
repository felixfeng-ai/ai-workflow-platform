name: Deploy Production

on:
  push:
    branches: [main]
    # 纯文档改动不触发生产重建：docs/ 与 design-previews/ 的变更不影响任何运行时产物，
    # 却会连带触发一次完整的 docker compose build + 服务重启，属无谓的生产变更。
    # 注意：混有代码的提交仍会正常部署（paths-ignore 只在「全部改动都被忽略」时跳过）。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design-previews/**'
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH 执行服务器部署脚本
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECTHUB_GITHUB_DEPLOY_TOKEN: ${{ secrets.PROJECTHUB_GITHUB_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.PROJECTHUB_HOST }}
          username: root
          key: ${{ secrets.PROJECTHUB_SSH_KEY }}
          envs: PROJECTHUB_GITHUB_DEPLOY_TOKEN
          script: |
            set -e
            bash /opt/projecthub-ai/cicd-deploy.sh
